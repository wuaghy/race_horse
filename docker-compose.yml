
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: racehorse_sqlserver
    restart: unless-stopped
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrong@Password2026!}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD:-YourStrong@Password2026!}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - racehorse_net

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: racehorse_db_init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrong@Password2026!}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
    volumes:
      - ./scripts/init-sql:/scripts
    entrypoint: ["/bin/bash", "-c"]
    command: ["tr -d '\\015' < /scripts/init-db.sh | /bin/bash"]
    networks:
      - racehorse_net

  identity-api:
    build:
      context: ./backend
      dockerfile: Services/Identity/Identity.Api/Dockerfile
    container_name: racehorse_identity_api
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: Development
      DemoData__Enabled: ${SEED_DEMO_DATA:-false}
      DemoData__Password: ${DEMO_DATA_PASSWORD:-HorseDev2026!}
      ConnectionStrings__IdentityDb: "Server=sqlserver,1433;Database=IdentityDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Password2026!};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY to a random value of at least 32 bytes}"
      Jwt__Issuer: ${JWT_ISSUER:-racehorse-identity}
      Jwt__Audience: ${JWT_AUDIENCE:-racehorse-api}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-30}
    ports:
      - "${IDENTITY_PORT:-8081}:8080"
    networks:
      - racehorse_net

  booking-api:
    build:
      context: ./backend
      dockerfile: Services/Booking/Booking.Api/Dockerfile
    container_name: racehorse_booking_api
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BookingDb: "Server=sqlserver,1433;Database=BookingDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Password2026!};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY to a random value of at least 32 bytes}"
      Jwt__Issuer: ${JWT_ISSUER:-racehorse-identity}
      Jwt__Audience: ${JWT_AUDIENCE:-racehorse-api}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${BOOKING_PORT:-8082}:8080"
    networks:
      - racehorse_net

  compliance-api:
    build:
      context: ./backend
      dockerfile: Services/Compliance/Compliance.Api/Dockerfile
    container_name: racehorse_compliance_api
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ComplianceDb: "Server=sqlserver,1433;Database=ComplianceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Password2026!};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY to a random value of at least 32 bytes}"
      Jwt__Issuer: ${JWT_ISSUER:-racehorse-identity}
      Jwt__Audience: ${JWT_AUDIENCE:-racehorse-api}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${COMPLIANCE_PORT:-8083}:8080"
    networks:
      - racehorse_net

  gateway-api:
    build:
      context: ./backend
      dockerfile: Gateway/Gateway.Api/Dockerfile
    container_name: racehorse_gateway_api
    depends_on:
      - identity-api
      - booking-api
      - compliance-api
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY to a random value of at least 32 bytes}"
      Jwt__Issuer: ${JWT_ISSUER:-racehorse-identity}
      Jwt__Audience: ${JWT_AUDIENCE:-racehorse-api}
      ReverseProxy__Clusters__identity__Destinations__identity-api__Address: http://identity-api:8080/
      ReverseProxy__Clusters__booking__Destinations__booking-api__Address: http://booking-api:8080/
      ReverseProxy__Clusters__compliance__Destinations__compliance-api__Address: http://compliance-api:8080/
    networks:
      - racehorse_net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: racehorse_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - racehorse_net

  minio:
    image: bitnamilegacy/minio:latest
    container_name: racehorse_minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - racehorse_net

  minio-init:
    image: bitnamilegacy/minio-client:latest
    container_name: racehorse_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      set -e;
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing myminio/documents;
      mc mb --ignore-existing myminio/health-images;
      mc mb --ignore-existing myminio/incident-attachments;
      mc mb --ignore-existing myminio/signatures;
      echo 'MinIO buckets created successfully';
    networks:
      - racehorse_net

volumes:
  sqlserver_data:
  rabbitmq_data:
  minio_data:

networks:
  racehorse_net:
    driver: bridge
